[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentcheck"
version = "0.1.0"
description = "Continuous integration for autonomous agents: generate adversarial scenarios, run them in a deterministic mock world, and score failure modes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Sahil Sadhwani" }]
keywords = [
    "ai-agents",
    "agent-evaluation",
    "reliability",
    "testing",
    "llm",
    "mcp",
    "continuous-integration",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
# The core is stdlib-only on purpose: agentcheck runs in CI, and a test harness
# that drags in a dependency tree is a test harness people skip installing.
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.scripts]
agentcheck = "agentcheck.cli:main"

[project.urls]
Homepage = "https://github.com/Sahilo6/agentcheck"
Repository = "https://github.com/Sahilo6/agentcheck"

[tool.hatch.build.targets.wheel]
packages = ["agentcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
